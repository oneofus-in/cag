<section class="mini-contact" id="contact">
    <div class="container">
        <div class="mini-contact-grid" data-anim="fade-up">
            <div class="mini-contact-text">
                <h2>יש לכם שאלות?</h2>
                <p>אנו מזמינים אתכם לשיחה ראשונית, ללא עלות וללא התחייבות, בה נכיר את הצרכים ונבחן יחד את הדרך המתאימה ביותר עבורכם!</p>
            </div>
            <form class="mini-contact-form">
                <div class="mini-contact-form-row">
                    <input type="text" name="name" placeholder="שם מלא" autocomplete="name">
                    <input type="tel" name="phone" placeholder="טלפון" autocomplete="tel">
                </div>
                <button type="submit" class="btn btn-white">לקביעת פגישת ייעוץ ללא עלות <i class="fa-solid fa-arrow-left"></i></button>
            </form>
        </div>
    </div>
</section>
