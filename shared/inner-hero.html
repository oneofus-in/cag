<!-- ═══════════════════════════════════════════════════════════
     HERO — masked frame expands on scroll. Identical to the
     homepage hero. Reusable on any inner page.

     HOW TO USE
     ──────────
     1. In <head>, after shared.css and before style.css:
          <link rel="stylesheet" href="/shared/inner-hero.css">

     2. Before </body>, after GSAP + components.js:
          <script src="/shared/inner-hero.js"></script>

     3. As the first element inside <main class="page-top">,
        paste the markup below and customize text + media.
═══════════════════════════════════════════════════════════ -->

<!-- HERO — masked frame expands on scroll -->
<section class="hero" id="hero">
    <div class="hero-stage">
        <div class="hero-frame">
            <video class="hero-img hero-video"
                   poster="/assets/img/hero-compound.jpg"
                   muted playsinline preload="none"
                   data-src="/uploads/bg.mp4"></video>
            <div class="hero-veil"></div>
            <div class="hero-scrim" aria-hidden="true"></div>
            <div class="hero-pattern" aria-hidden="true"></div>
            <div class="hero-corner hero-corner-tl" aria-hidden="true"></div>
            <div class="hero-corner hero-corner-tr" aria-hidden="true"></div>
            <div class="hero-corner hero-corner-bl" aria-hidden="true"></div>
            <div class="hero-corner hero-corner-br" aria-hidden="true"></div>
            <div class="hero-dimension" aria-hidden="true"><span>תכנון מדויק · ייצור ישראלי</span></div>

            <div class="hero-content">
                <div class="hero-eyebrow">תוצרת ישראלית · מאז 2008</div>
                <h1>
                    <span class="hero-line-1">א.ג. קרוואנים</span>
                    <span class="hero-line-2 gradient-text-light">מבני לינה ומתחמי תיירות <br>בהתאמה אישית כחול לבן</span>
                </h1>
                <p class="hero-text">
מבנים ומתחמים, פוד טראקים ופתרונות למגזר הביטחוני
ללקוחות פרטיים, עסקים ורשויות במבנים – משלב התכנון ועד ההקמה בשטח
                </p>
                <div class="hero-actions">
                    <a href="#contact" class="btn btn-ghost">התחילו פרויקט <i class="fa-solid fa-arrow-left"></i></a>
                </div>
            </div>

<div class="hero-scroll-hint">
                <span>גלילה</span>
                <span class="line"></span>
            </div>
        </div>
    </div>
</section>
